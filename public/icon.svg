<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Network Fiber Waves (Wifi & Optics) -->
  <g transform="translate(256, 170)" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M-130,-40 A 140 140 0 0 1 130,-40" stroke-opacity="0.4" />
    <path d="M-90,0 A 95 95 0 0 1 90,0" stroke-opacity="0.7" />
    <path d="M-50,40 A 55 55 0 0 1 50,40" />
  </g>

  <!-- Central Hub Circle / Wallet Node with Glow -->
  <circle cx="256" cy="300" r="96" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="10" filter="url(#glow)" />
  
  <!-- Fiber Optic Connected Nodes -->
  <line x1="130" y1="380" x2="200" y2="340" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8" />
  <circle cx="120" cy="385" r="18" fill="#10b981" />
  
  <line x1="382" y1="380" x2="312" y2="340" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8" />
  <circle cx="392" cy="385" r="18" fill="#06b6d4" />

  <line x1="256" y1="396" x2="256" y2="440" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8" />
  <circle cx="256" cy="445" r="16" fill="#6366f1" />

  <!-- Bengali Taka Symbol ৳ in Center Node -->
  <text x="256" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="94" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))">৳</text>
</svg>
